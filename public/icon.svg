<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#171717" />
      <stop offset="50%" stop-color="#0a0a0a" />
      <stop offset="100%" stop-color="#000000" />
    </linearGradient>
    <linearGradient id="goldGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#fbbf24" />
      <stop offset="50%" stop-color="#f59e0b" />
      <stop offset="100%" stop-color="#d97706" />
    </linearGradient>
    <linearGradient id="fireGrad" x1="0%" y1="100%" x2="0%" y2="0%">
      <stop offset="0%" stop-color="#ef4444" />
      <stop offset="50%" stop-color="#f97316" />
      <stop offset="100%" stop-color="#eab308" />
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="12" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <!-- Background with rounded squircle -->
  <rect width="512" height="512" rx="115" fill="url(#bgGrad)" />
  <rect width="504" height="504" x="4" y="4" rx="111" fill="none" stroke="url(#goldGrad)" stroke-width="6" stroke-opacity="0.4" />

  <!-- Ambient Glow Background -->
  <circle cx="256" cy="240" r="140" fill="#f59e0b" fill-opacity="0.12" filter="url(#glow)" />

  <!-- Dual Lightning / Fire Wings -->
  <path d="M140 180 Q200 130 256 160 Q312 130 372 180 Q330 240 256 220 Q182 240 140 180 Z" fill="url(#fireGrad)" opacity="0.3" />

  <!-- Master Microphone Icon & Golden Crown -->
  <g transform="translate(0, -10)">
    <!-- Crown of Freestyle Mastery -->
    <path d="M196 150 L220 180 L256 130 L292 180 L316 150 L310 200 L202 200 Z" fill="url(#goldGrad)" filter="url(#glow)" />
    <circle cx="196" cy="144" r="5" fill="#fef08a" />
    <circle cx="256" cy="124" r="7" fill="#fef08a" />
    <circle cx="316" cy="144" r="5" fill="#fef08a" />

    <!-- Mic Capsule -->
    <rect x="220" y="195" width="72" height="110" rx="36" fill="url(#goldGrad)" />
    <!-- Mic Mesh lines -->
    <line x1="228" y1="225" x2="284" y2="225" stroke="#78350f" stroke-width="3" stroke-linecap="round" />
    <line x1="228" y1="245" x2="284" y2="245" stroke="#78350f" stroke-width="3" stroke-linecap="round" />
    <line x1="228" y1="265" x2="284" y2="265" stroke="#78350f" stroke-width="3" stroke-linecap="round" />
    <line x1="256" y1="205" x2="256" y2="285" stroke="#78350f" stroke-width="3" stroke-linecap="round" />

    <!-- Mic U-Bracket -->
    <path d="M200 255 C200 320 312 320 312 255" fill="none" stroke="#fef08a" stroke-width="12" stroke-linecap="round" />
    
    <!-- Mic Stem & Base -->
    <line x1="256" y1="315" x2="256" y2="365" stroke="#fef08a" stroke-width="12" stroke-linecap="round" />
    <path d="M205 375 L307 375" stroke="url(#goldGrad)" stroke-width="14" stroke-linecap="round" />

    <!-- Sound Wave Pulses -->
    <path d="M165 230 A80 80 0 0 0 165 290" fill="none" stroke="#f59e0b" stroke-width="8" stroke-linecap="round" opacity="0.8" />
    <path d="M140 210 A110 110 0 0 0 140 310" fill="none" stroke="#f59e0b" stroke-width="6" stroke-linecap="round" opacity="0.5" />
    <path d="M347 230 A80 80 0 0 1 347 290" fill="none" stroke="#f59e0b" stroke-width="8" stroke-linecap="round" opacity="0.8" />
    <path d="M372 210 A110 110 0 0 1 372 310" fill="none" stroke="#f59e0b" stroke-width="6" stroke-linecap="round" opacity="0.5" />
  </g>

  <!-- App Typography Branding -->
  <text x="256" y="445" font-family="'Unbounded', 'Impact', sans-serif" font-weight="900" font-size="34" fill="#ffffff" text-anchor="middle" letter-spacing="3">RIMALAB</text>
  <text x="256" y="475" font-family="'Plus Jakarta Sans', sans-serif" font-weight="800" font-size="14" fill="#fbbf24" text-anchor="middle" letter-spacing="4">ACADEMIA DE RIMAS</text>
</svg>
